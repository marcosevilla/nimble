[package]
name = "nimble-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.90.0"

[[bin]]
name = "dt"
path = "src/main.rs"

[dependencies]
nimble-core = { path = "../../nimble-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.50.0", features = ["full"] }
chrono = "0.4.44"
dirs = "6"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
nimble-core = { path = "../../nimble-core", features = ["test-util"] }
