<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="check" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E0653A"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2723"/>
      <stop offset="1" stop-color="#1B1917"/>
    </linearGradient>
  </defs>
  <!-- macOS-style squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#bg)"/>
  <!-- Subtle inner ring for depth -->
  <rect x="10" y="10" width="1004" height="1004" rx="218" ry="218" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="8"/>
  <!-- Checkmark -->
  <polyline points="292,548 452,708 738,354" fill="none" stroke="url(#check)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
